[project]
name = "cis-api"
version = "0.1.0"
description = "Contract Intelligence System — power transformer sourcing intelligence"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Settings & validation
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    # Graph DB
    "neo4j>=5.27",
    # LLM / AI
    "anthropic>=0.51",
    "voyageai>=0.3",
    # Agent orchestration
    "langgraph>=0.4",
    "langchain-anthropic>=0.3",
    "langsmith>=0.3",
    # Prompt optimization
    "dspy>=2.6",
    # Scheduling
    "inngest>=0.4",
    # Data ingestion
    "yfinance>=0.2",
    "feedparser>=6.0",
    "httpx>=0.28",
    "tenacity>=9.0",
    "google-cloud-bigquery>=3.30",
    # Utilities
    "python-dateutil>=2.9",
    "pytz>=2025.2",
    "xgboost>=3.2.0",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.3",
    "networkx>=3.6.1",
    # Manual signal ingestion — file parsing
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "beautifulsoup4>=4.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "pytest-httpx>=0.35",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["apps/api"]
exclude = ["apps/api/db/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
